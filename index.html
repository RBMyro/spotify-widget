<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Widget</title>
  <style>
    @font-face {
        font-family: 'RunescapeChat';
        src: url('RuneScape-Chat-Bold-07.ttf');
    }

    .card {
      position: relative;
      width: 450px;
      height: 110px;
    }

    .backdrop {
      position: absolute;
      top: 15px;
      left: 0px;
      width: 450px;
      height: 65px;
      background: repeating-linear-gradient(
        -45deg,
        orange,
        orange 2px,
        rgba(255, 200, 140, 1) 2px,
        rgba(255, 200, 140, 1) 3px
      );
      border-radius: 6px;
    }

    .bar {
      position: absolute;
      top: 0;
      left: 8px;
      width: 420px;
      height: 30px;
      background: rgba(95, 75, 115, 1);
      color: white;
      padding: 20px;
      font-family: 'RunescapeChat', sans-serif;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      border-radius: 6px;
    }

    .brand {
        font-size: 24px;
        color: white;
    }

    .divider {
        width: 4px;
        align-self: stretch;
        background: orange;
        border-radius: 2px;
    }

    .speaker {
        width: 26px;
        height: 22px;
        position: relative;
        z-index: 2;
        background: rgba(95, 75, 115, 1)
    }

    .spacer {
        width: 0px;
    }

    .track-area {
        position: relative;
        flex: 1;
        height: 100px;
        overflow: hidden;
    }

     .track-name {
        position: absolute;
        left: 100%;
        top: 50%;
        transform: translate(0, -50%);
        font-size: 16px;
        color: white;
        white-space: nowrap;
        animation: scroll-left 20s linear infinite;
        font-size: 30px;
    }

    @keyframes scroll-left {
        from { transform: translate(0,-50%); }
        to   { transform: translate(-500px, -50%); }
    }
    
    .speaker .cone {
        fill: none;
        stroke: white;
        stroke-width: 2;
        stroke-linejoin: round;
    }
    .speaker .wave {
        fill: none;
        stroke: orange;
        stroke-width: 2;
        stroke-linecap: round;
    }
    .speaker .w1 {
        animation: pulse 1.6s ease-in-out infinite;
    }
    .speaker .w2 {
        animation: pulse 1.6s ease-in-out infinite 0.25s;
    }


    @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% {opacity: 1; }
    }


    .subtitle {
      font-size: 12px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="backdrop"></div>
    <div class="bar">
        <div class="brand">
            Stream Radio
      <div class="subtitle">Playing: Stream Playlist</div>
    </div>
    <div class="divider"></div>
    <svg class="speaker" viewBox="0 0 30 22">
        <path class="cone" d="M2 8 H8 L15 2 V20 L8 14 H2 Z"/>
        <path class="wave w1" d="M19 7 Q22 11 19 15"/>
        <path class="wave w2" d="M23 4 Q28 11 23 18"/>
    </svg>
    <div class="spacer"></div>
    <div class="track-area">
        <div class="track-name">Now Playing</div>
    </div>
  </div>
  </div>

  <button id="connectBtn">Connect Spotify</button>

  <script>
    function randomString(length) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars[Math.floor(Math.random() * chars.length)];
        }
        return result;
    }

    async function sha256base64url(str) { 
        const encoded = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', encoded);
        const hashArray = new Uint8Array(hashBuffer);
        let base64 = btoa(String.fromCharCode(...hashArray));
        return base64.replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    const CONFIG = {
        CLIENT_ID: '6f7347e59283473ba0968cab2953d1d0',
        REDIRECT_URL: 'https://rbmyro.github.io/spotify-widget/'
    };

    async function startLogin() {
        const verifier = randomString(64);
        sessionStorage.setItem('verifier', verifier);

        const challenge = await sha256base64url(verifier);

        const params = new URLSearchParams({
            client_id: CONFIG.CLIENT_ID,
            response_type: 'code',
            redirect_uri: CONFIG.REDIRECT_URL,
            code_challenge_method: 'S256',
            code_challenge: challenge,
            scope: 'user-read-currently-playing'
        });

        window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
    }

    document.getElementById('connectBtn').addEventListener('click', startLogin);

    async function exchangeCodeForToken(code) {
        const verifier = sessionStorage.getItem('verifier');

        const body = new URLSearchParams({
            client_id: CONFIG.CLIENT_ID,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: CONFIG.REDIRECT_URL,
            code_verifier: verifier
        });

        const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded'},
            body: body
        });

        const data = await response.json();
        return data.access_token;
    }

    function setTrack(text) {
     const el = document.querySelector('.track-name');
      el.style.animation = 'none';
      el.offsetHeight;
      el.textContent = text;
      el.style.animation = '';
    }
    
    let lastTrack = '';


      async function pollNowPlaying(token) {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (response.status === 204) {
            if (lastTrack !== 'none') {
            setTrack('Nothing Playing right now');
            lastTrack = 'none';
            }
            return;
        }

        const data = await response.json();
        const artist = data.item.artists[0].name;
        const song = data.item.name;
        const current = artist + ' - ' + song;

        if (current !== lastTrack) {
            setTrack(current);
            lastTrack = current;
        }
      }

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (code) {
            const token = await exchangeCodeForToken(code);
            console.log('Got access token:', token);

            pollNowPlaying(token);
            setInterval(() => pollNowPlaying(token), 5000);
        }
      }
    init();
  </script>
</body>
</html>
